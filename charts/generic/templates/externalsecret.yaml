{{- $root := . }}
{{- range $k, $v := .Values.externalSecrets }}
{{- $name := include "generic.childName" (list $root $k) }}
---
apiVersion: {{ $root.Values.externalSecretsApiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ include "generic.namespace" $root }}
  labels:
    {{- include "generic.labels" $root | nindent 4 }}
  {{- with (include "generic.annotations" (list $root $v.annotations) | trim) }}{{ . | nindent 2 }}{{ end }}
spec:
  refreshInterval: {{ $v.refreshInterval | default "1h" }}
  secretStoreRef:
    {{- tpl (required (printf "externalSecrets.%s.secretStoreRef is required" $k) $v.secretStoreRef | toYaml) $root | nindent 4 }}
  target:
    {{- toYaml (merge (deepCopy ($v.target | default dict)) (dict "name" $name "creationPolicy" "Owner")) | nindent 4 }}
  {{- with $v.data }}
  data:
    {{- tpl (toYaml .) $root | nindent 4 }}
  {{- end }}
  {{- with $v.dataFrom }}
  dataFrom:
    {{- tpl (toYaml .) $root | nindent 4 }}
  {{- end }}
{{- end }}
