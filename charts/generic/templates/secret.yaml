{{- $root := . }}
{{- range $k, $v := .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "generic.childName" (list $root $k) }}
  namespace: {{ include "generic.namespace" $root }}
  labels:
    {{- include "generic.labels" $root | nindent 4 }}
    {{- with $v.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with (include "generic.annotations" (list $root $v.annotations) | trim) }}{{ . | nindent 2 }}{{ end }}
type: {{ $v.type | default "Opaque" }}
{{- with $v.stringData }}
stringData:
  {{- range $key, $val := . }}
  {{- $rendered := toString $val }}
  {{- if $v.tpl }}{{ $rendered = tpl $rendered $root }}{{ end }}
  {{- dict $key $rendered | toYaml | nindent 2 }}
  {{- end }}
{{- end }}
{{- with $v.data }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
