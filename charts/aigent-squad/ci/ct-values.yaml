## Minimal values for chart-testing (ct lint / ct install on a bare kind cluster).
## No CRDs, no external deps — exercises the default inProcess topology.

topology: inProcess

global:
  image:
    registry: ""              # public GHCR image (tag = Chart.appVersion)
  # CI kind cluster has no DynamoDB/AWS: the supervisor's /ready (which checks
  # DynamoDB) can never pass there, so CI gates on liveness-level health.
  probes:
    readiness:
      path: /healthz
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 3
  otel:
    enabled: false
  env:
    AWS_REGION: "us-east-1"
    ENVIRONMENT: "DEV"

services:
  # Gateway tier (spec 31) — pinned to no-autoscaling for the bare kind cluster
  # (KEDA CRD is absent in chart-testing). Real envs use values-<env>.yaml.
  gateway:
    enabled: true
    image:
      repository: ghcr.io/staffops/aigent-squad
    command: ["python", "-m", "src.gateway.main"]
    port: 8000
    mountAgents: false
    expose: false
    serviceAccount:
      create: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    workload:
      kind: Deployment
    scaling:
      replicas: 1
      autoscaling:
        kind: none
    networkPolicy:
      enabled: false

  supervisor:
    enabled: true
    image:
      repository: ghcr.io/staffops/aigent-squad
    command: ["python", "-m", "src.supervisor.server"]
    port: 8001
    # Use the agents baked into the image: an inline test agent drifts from the
    # app's AgentConfig schema (it did — `capabilities` became required).
    mountAgents: false
    expose: false
    serviceAccount:
      create: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    workload:
      kind: Deployment
    scaling:
      replicas: 1
      autoscaling:
        kind: none
    networkPolicy:
      enabled: false

agentsSource:
  type: configmap

agents: []

redis:
  host: ""
  inCluster:
    enabled: true             # the app requires REDIS_HOST at startup

externalSecrets:
  enabled: false

routing:
  type: none

networkPolicy:
  enabled: false
