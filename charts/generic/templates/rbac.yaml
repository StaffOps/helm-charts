{{- if .Values.rbac.create }}
{{- $sa := include "generic.serviceAccountName" . }}
{{- $ns := include "generic.namespace" . }}
{{- if .Values.rbac.rules }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "generic.fullname" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "generic.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "generic.fullname" . }}
  namespace: {{ $ns }}
  labels:
    {{- include "generic.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "generic.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $ns }}
{{- end }}
{{- if .Values.rbac.clusterRules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # Namespaced name: cluster-scoped objects collide across releases otherwise.
  name: {{ printf "%s-%s" $ns (include "generic.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "generic.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.clusterRules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s" $ns (include "generic.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "generic.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s" $ns (include "generic.fullname" .) | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $ns }}
{{- end }}
{{- end }}
