{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "generic.serviceAccountName" . }}
  namespace: {{ include "generic.namespace" . }}
  labels:
    {{- include "generic.labels" . | nindent 4 }}
    {{- with .Values.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with (include "generic.annotations" (list . .Values.serviceAccount.annotations) | trim) }}{{ . | nindent 2 }}{{ end }}
automountServiceAccountToken: {{ or .Values.serviceAccount.automount .Values.rbac.create }}
{{- end }}
